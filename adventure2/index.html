<!DOCTYPE html>
<html>
  <head>
    <style>
      body{
  overflow: hidden;
}
.world-content {
  position: relative;
  width: 0px;
  height: 0px;

  div {
    position: absolute;
    background-color: black;
  }
}

.world {
  position: fixed;
  width: 100%;
  height: 100%;
  top: 0px;
  left: 0px;
  overflow: hidden;
}

.ground {
  position: absolute;
  top: 0px;
  left: 0px;
  width: var(--mapSizeXPx);
  height: var(--mapSizeYPx);
  background-size: 300px 200px;
  background-image: url("../assets/images/grass.jpeg");
}


.player {
  position: absolute;
  left: 0;
  top: 0;
  width: 10px;
  height: 10px;
  background-color: red;
  border-radius: 100%;
  transform: translate(-50%, -50%);
}

      
      :root {
        --cs: 100px;
      }

      .controls {
        position: fixed;
        bottom: 0px;
        left: 0%;
        display: grid;
        grid-template-rows: var(--cs);
        grid-template-columns: var(--cs) var(--cs);
        display: grid;

        .angle, .motion {
          background-color: lightgray;
        }

        button {
          display: block;
          background: none;
          margin: 0;
          padding: 0;
          border: none;

          &:active span:hover {
            background-color: pink;
          }
        }

        .angle {
          position: relative;
          overflow: hidden;

          .motion-grid{
            display: grid;
            position: static;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            width: 100%;
            height: 100%;
            transform-origin:50% 50%;
            transform: rotateZ(135deg);
            div{
              height: calc(var(--cs)/2);
              overflow: hidden;
              span{
                display: block;
                width: 100%;
                height: 100%;
              }
              .rot-u, .rot-d{
                height: 720px;
              }
            }
          }

        }
        .motion {
          position: relative;
          overflow: hidden;
          border-radius: 100%;
        }
        .motion .motion-grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          grid-template-rows: 1fr 1fr;
          width: 100%;
          height: 100%;
          transform: rotateZ(-45deg);
        }
        .middle-cover{
          width: 25%;
          height: 25%;
          position: absolute;
          left: 37.5%;
          top: 37.5%;
          border-radius: 100%;
          background-color: lightgray;
        }
        .cover {
          width: 0px;
          height: 0px;
          position: absolute;
          left: 50%;
          top: 50%;
          transform: scale(30);
          opacity: 0.1;

          .world-content div {
            /* expandera hitboxar för bättre kollision */
            border: 5px solid black;
            transform: translate(-5px, -5px);
          }
        }
      }

      
@property --world-rot-pos {
  syntax: "<number>";
  initial-value: 0;
  inherits: false;
}
@property --world-rot-neg {
  syntax: "<number>";
  initial-value: 0;
  inherits: false;
}
@property --world-pitch-pos{
  syntax: "<number>";
  initial-value: 0;
  inherits: false;
}
@property --world-pitch-neg{
  syntax: "<number>";
  initial-value: 0;
  inherits: false;
}
@property --world-move-x-pos {
  syntax: "<number>";
  initial-value: 0;
  inherits: false;
}
@property --world-move-x-neg {
  syntax: "<number>";
  initial-value: 0;
  inherits: false;
}
@property --world-move-y-pos {
  syntax: "<number>";
  initial-value: 0;
  inherits: false;
}
@property --world-move-y-neg {
  syntax: "<number>";
  initial-value: 0;
  inherits: false;
}

@keyframes rotate-pos { to { --world-rot-pos: 1; } }
@keyframes rotate-neg { to { --world-rot-neg: 1; } }
@keyframes pitch-pos{ to { --world-pitch-pos: 1; } }
@keyframes pitch-neg { to { --world-pitch-neg: 1; } }
@keyframes move-x-pos { to { --world-move-x-pos: 1; } }
@keyframes move-x-neg { to { --world-move-x-neg: 1; } }
@keyframes move-y-pos { to { --world-move-y-pos: 1; } }
@keyframes move-y-neg { to { --world-move-y-neg: 1; } }

.world-anim {
  --mapSizeX: 3000;
  --mapSizeY: 3000;
  --mapSizeXPx: calc(var(--mapSizeX) * 1px);
  --mapSizeYPx: calc(var(--mapSizeY) * 1px);

  --moveTimeX: calc(var(--mapSizeX) / 100 * 1s);
  --moveTimeY: calc(var(--mapSizeY) / 100 * 1s);

  animation:
    rotate-pos 5s linear infinite,
    rotate-neg 5s linear infinite,
    move-x-pos var(--moveTimeX) linear infinite,
    move-x-neg var(--moveTimeX) linear infinite,
    move-y-pos var(--moveTimeY) linear infinite,
    move-y-neg var(--moveTimeY) linear infinite,
    pitch-pos 5s linear infinite,
    pitch-neg 5s linear infinite;
  animation-play-state: paused, paused, paused, paused, paused, paused, paused, paused;

  --world-rotation: rotate(calc((var(--world-rot-pos) - var(--world-rot-neg)) * -360deg));
  --world-pitch: rotateX(calc((var(--world-pitch-pos) - var(--world-pitch-neg)) * -360deg));
  --pitch-movement-down: scale(14) translateY(calc(mod(var(--world-pitch-pos) - var(--world-pitch-neg) + 0.5, 1) * -15% + 7.5% - 50%));
  --pitch-movement-up: scale(14) translateY(calc(mod(var(--world-pitch-pos) - var(--world-pitch-neg) + 0.5, 1) * 15% - 7.5% - 50%)) ;

  --world-translation: translate(
    calc(mod(var(--world-move-x-pos) - var(--world-move-x-neg) + 0.5, 1) * var(--mapSizeXPx) * -1), /*Is this correct?*/
    calc(mod(var(--world-move-y-pos) - var(--world-move-y-neg) + 0.5, 1) * var(--mapSizeYPx) * -1)
    );

  &:has(button:active .rot-r:hover) {
    animation-play-state: running, paused, paused, paused, paused, paused, paused, paused;
  }
  &:has(button:active .rot-d:hover) {
    animation-play-state: paused, paused, paused, paused, paused, paused, running, paused;
  }
  &:has(button:active .rot-u:hover) {
    animation-play-state: paused, paused, paused, paused, paused, paused, paused, running;
  }
  &:has(button:active .rot-l:hover) {
    animation-play-state: paused, running, paused, paused, paused, paused, paused, paused;
  }
  &:has(button:active .move-l:hover) {
    animation-play-state: paused, paused, running, paused, paused, paused, paused, paused;
  }
  &:has(button:active .move-r:hover) {
    animation-play-state: paused, paused, paused, running, paused, paused, paused, paused;
  }
  &:has(button:active .move-u:hover) {
    animation-play-state: paused, paused, paused, paused, running, paused, paused, paused;
  }
  &:has(button:active .move-d:hover) {
    animation-play-state: paused, paused, paused, paused, paused, running, paused, paused;
  }
}

.world-translation {
  transform: var(--world-translation);
}
.world-rotation {
  transform: var(--world-rotation);
}
.pitch-control-movement-up {
  transform: var(--pitch-movement-up);
}
.pitch-control-movement-down {
  transform: var(--pitch-movement-down);
}
.world-transform {
  transform:  var(--world-pitch) translateZ(-50px) var(--world-rotation) var(--world-translation) ;
}

@keyframes animator {
from { width: 0px }
to { width: 100px }
}
.animator {
  animation: animator linear 1s infinite;
}

      .center{
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
}
.threeD{
        margin-top: 100px;
        margin-left: 100px;
        transform-style: preserve-3d;
        transform: perspective(100cm);
}

.threeD div{
        transform-style: preserve-3d;
        background-image: url("../assets/images/debug.png");
        background-size: 100%;
}

/*front*/
.cubed{
        height:var(--height) !important;
        width: var(--width) !important;
        background-image: var(--img);
        background-color: var(--color);
        transform-style: preserve-3d;
        /*(in)SANE DEFAULTS*/
        --width: 100px;
        --height: 100px;
        --depth: 100px;
        --img: none;
        --color: #000;
        --flipY: 0deg;
        /*
        DEBUG
        */
        /* 
        transform: perspective(100cm) rotate3D(1, 0, 1, 45deg);
        animation-name: debug;
        animation-iteration-count: infinite;
        animation-duration: 4s;
        animation-timing-function: linear;
*/
}


/* top */
.cubed > div:nth-child(1){
        position: absolute;
        top: calc(var(--depth) / 2);
        left: 50%;
        width: var(--width);
        height: var(--depth);
        transform: translate(-50%, -50%) rotateX(90deg) rotate(180deg) translate(0, -100%);
        transform-origin: 50% 0% 0;
}

/* bottom */
.cubed > div:nth-child(2){
        position: absolute;
        top: calc(var(--height) - var(--depth) / 2);
        left: 50%;
        width: var(--width);
        height: var(--depth);
        transform: translate(-50%, -50%) rotateX(-90deg);
        transform-origin: 50% 100% 0;
}

/* right */
.cubed > div:nth-child(3){
        position: absolute;
        top: 50%;
        left: calc(var(--width) - var(--height) / 2);
        width: var(--height); 
        height: var(--depth);
        transform: translate(-50%, -50%) rotateY(90deg) rotate(-90deg) translate(50%, -50%);
        transform-origin: 100% 50% 0;
}

/* left */
.cubed > div:nth-child(4){
        position: absolute;
        top: 50%;
        left: calc(var(--height) / 2);
        width: var(--height); 
        height: var(--depth);
        transform: translate(-50%, -50%) rotateY(-90deg) rotate(90deg) translate(-50%, -50%);
        transform-origin: 0% 50% 0;
}

/*back*/
.cubed > div:nth-child(5){
        position: absolute;
        top: 50%;
        left: 50%;
        height:var(--height);
        width: var(--width);
        transform: translate(-50%, -50%) translateZ(var(--depth));
}


@keyframes debug {
        from {transform: perspective(100cm) rotate3D(1, 1, 1, 0deg);}
        to {transform: perspective(100cm) rotate3D(1, 1, 1, 360deg);}
}

.cubed > div{
        transform-style: preserve-3d;
        background-image: var(--img);
        background-color: var(--color);
        transform: perspective(100cm);
        background-size: 100% 100%;
}

      .world-content{
  .roof{
    transform: translateZ(var(--arg0));
    --img:url("../assets/images/wood.jpg");
    --roofImg:url("../assets/images/roof.jpg");
    --angle: 45deg;
    --overhang: 30px;
    --roofA: calc((var(--height) / 2 + var(--overhang)));
    div:nth-child(1){
      transform: rotateX(var(--angle));
      height: calc(var(--roofA) / cos(var(--angle)));
      width:calc(var(--width) + var(--overhang) * 2);
      left: calc(var(--overhang) * -1);
      top: calc(var(--overhang) * -1);
      backface-visibility: visible;
      background-image: var(--roofImg);
      background-size: 200px 200px;
    }
    div:nth-child(2){
      transform: rotateX(calc(-1 * var(--angle)));
      height: calc(var(--roofA) / cos(var(--angle)));
      bottom: calc(var(--overhang) * -1);
      top: initial;
      width:calc(var(--width) + var(--overhang) * 2);
      left: calc(var(--overhang) * -1);
      backface-visibility: visible;
      background-image: var(--roofImg);
      background-size: 200px 200px;
    }
    div:nth-child(3){
      height:calc(tan(var(--angle)) * var(--roofA));
      left: calc(var(--width) - var(--height) / 2 - var(--overhang));
      width:calc(var(--height) + var(--overhang) * 2);
      clip-path: polygon(0 100%, 50% 0, 100% 100%);
    }
    div:nth-child(4){
      height:calc(tan(var(--angle)) * var(--roofA));
      left: calc(var(--height) / 2 + var(--overhang));
      width:calc(var(--height) + var(--overhang) * 2);
      clip-path: polygon(0 100%, 50% 0, 100% 100%);
    }
  }
  div{
    div{
      backface-visibility:hidden;
    }
  }
  .wall{
    --img:linear-gradient(#0000, #0007), url("../assets/images/bricks.jpg");
    div{
      image-rendering: pixelated;
      background-size: 100% 100%, 210px 210px;
    }
  }
  .pole{
    --pHeight: 100px;
    transform: translateZ(var(--pHeight));
    --img:url("../assets/images/bricks.jpg");
    div{
      background-size:200px 200px;
    }
  }
  .window{
    --pHeight:100px;
    --img:url("../assets/images/bricks.jpg");
    --windowImage: url("../assets/images/window.png");
    div{
      background-size:200px 200px;
    }
    div:nth-child(5)::before{
      display:block;
      background-image: var(--windowImage);
      background-size: 100% 100%;
      height:60px;
      content:"";
    }
  }
    .window.horizontal div:nth-child(5)::before{
      width:var(--width);
      transform-origin: 0 0;
      transform:rotateX(90deg) translateZ(calc(var(--height) / -2));
    }
    .window.vertical div:nth-child(5)::before{
      width:var(--height);
      transform-origin: 0 0;
      transform: rotateY(-90deg) rotate(-90deg) translateX(calc(-1 * var(--height))) translateZ(calc(var(--width) / -2));
    }
    .Paper{
    background-color:green;
    --special: linear-gradient(#0001, #000a), url("../assets/images/wall.png");
  }
  .north {
    div:nth-child(2){
      background-image: var(--special);
    }
  }
  .west{
    div:nth-child(3){
      background-image: var(--special);
    }
  }
  .south{
    div:nth-child(1){
      background-image: var(--special);
    }
  }
  .east{
    div:nth-child(4){
      background-image: var(--special);
    }
  }
  .museum{
      /*animation: spin 8s linear infinite;*/
    div{
      background-color:green;
      background-image: linear-gradient(#0001, #000a), url("../assets/images/wall.png");
    }
    div:nth-child(3)::before{
      content: "";
      display:block;
      width:inherit;
      height:inherit;
      background-repeat: no-repeat;
      background-image:url("/assets/images/contact.gif");
    }
    div:nth-child(4)::before{
      content: "";
      display:block;
      width:inherit;
      height:inherit;
      background-repeat: no-repeat;
      background-image:url("/assets/images/hello.gif");
    }
    div:nth-child(5)::before{
      content: "";
      display:block;
      width:inherit;
      height:inherit;
      background-repeat: no-repeat;
      background-image:url("/assets/images/contact.gif");
    }
  }
  .floor{
    --img: url("/assets/images/wood.jpg");
  }
}

      .skyboxHolder{
  --skyboxSize: 1000px;
  transform-style:preserve-3d;
  position: absolute;
  width:0px;
  height:0px;
  left:50%;
  top:50%;
  transform: perspective(var(--fov)) translateZ(calc(var(--fov) - var(--skyboxSize)/2));
  transition: transform 1s;
  .skybox{
    position:absolute;
    left:calc(var(--skyboxSize)/-2);
    top:calc(var(--skyboxSize)/-2);
    --width:var(--skyboxSize);
    --height:var(--skyboxSize);
    --depth:var(--skyboxSize);
    transform-origin: 50% 50% calc(var(--skyboxSize)/2);
    transform: rotateX(90deg) var(--world-pitch) var(--world-rotation);
    background-color:blue;
    background-image: url("../assets/images/sky/night/face_ny_bottom.png");
    background-size: 100% 100%;
    div{
      background-size: 100% 100%;
    }
    div:nth-child(1){
      background-image: url("../assets/images/sky/night/face_nz_back.png")
    }
    div:nth-child(2){
      background-image: url("../assets/images/sky/night/face_pz_front.png")
    }
    div:nth-child(3){
      background-image: url("../assets/images/sky/night/face_px_right.png")
    }
    div:nth-child(4){
      background-image: url("../assets/images/sky/night/face_nx_left.png")
    }
    div:nth-child(5){
      background-image: url("../assets/images/sky/night/face_py_top.png")
    }
    div:nth-child(6){
      background-image: url("../assets/images/sky/night/face_ny_bottom.png")
    }
  }
  .floor{
    left:calc(var(--skyboxSize)/-2);
    top:0px;
    background-image:url("../assets/images/wood.jpg");
    position:absolute;
    width:var(--skyboxSize);
    height:var(--skyboxSize);
    transform: rotateX(89deg) var(--world-rotation);
    transform-origin: top left;
  }
}
